name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -c "import py_compile; py_compile.compile('app.py', doraise=True)"

      - name: Health check (start server)
        run: |
          python -c "
          import uvicorn
          import asyncio
          from app import app
          async def test():
              config = uvicorn.Config(app, host='127.0.0.1', port=7860, log_level='error')
              server = uvicorn.Server(config)
              await server.serve()
          asyncio.run(test())
          " &
          sleep 3
          curl -f http://127.0.0.1:7860/health || exit 1
          curl -f http://127.0.0.1:7860/docs || exit 1
          kill %1 2>/dev/null || true

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload static files
        uses: actions/upload-artifact@v4
        with:
          name: static-files
          path: static/
          retention-days: 1

  build-docker:
    needs: [test, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download static files
        uses: actions/download-artifact@v4
        with:
          name: static-files
          path: static/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: github-mirror:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
